[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-behavior-interpreter"
version = "0.1.0"
description = "A trial-aware contrast, perturbation, and boundary interpreter for temporal social states"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
social-gnn = ["torch>=2.0", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
include = ["interpreter*"]

